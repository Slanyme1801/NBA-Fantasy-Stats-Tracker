<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA Fantasy Stats</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy Stats">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/icon-192.png">
<style>
  :root{
    --bg:#0d1220; --bg-2:#131b2e; --panel:#171f33; --line:#26314c;
    --ink:#e9edf6; --ink-dim:#9aa6bf; --ink-faint:#6b7690;
    --amber:#ffb020; --amber-soft:rgba(255,176,32,.14);
    --cyan:#54c8e8; --up:#43c98a; --down:#ff6b81;
    --radius:14px;
    --sans:"Inter","Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  a{color:inherit}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  header.top{
    display:flex;align-items:center;gap:18px;padding:14px 20px;
    border-bottom:1px solid var(--line);background:var(--bg-2);
    position:sticky;top:0;z-index:20;flex-wrap:wrap;
  }
  .brand{font-weight:700;letter-spacing:-.02em;cursor:pointer;font-size:16px}
  .brand span{color:var(--amber)}
  nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  nav button{
    background:transparent;border:1px solid transparent;color:var(--ink-dim);
    padding:7px 12px;border-radius:9px;
  }
  nav button.active{background:var(--panel);border-color:var(--line);color:var(--ink)}

  main{max-width:1120px;margin:0 auto;padding:26px 18px 80px}
  .hero{padding:70px 0 40px;text-align:center}
  .hero h1{
    font-size:clamp(30px,6vw,52px);letter-spacing:-.035em;margin:0 0 10px;line-height:1.05;
  }
  .hero p{color:var(--ink-dim);margin:0 0 30px}
  .seasons-strip{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:28px;
    color:var(--ink-faint);font-size:13px;
  }
  .seasons-strip b{color:var(--ink-dim);font-weight:600}

  .searchbox{position:relative;max-width:520px;margin:0 auto}
  .searchbox input{
    width:100%;padding:15px 16px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:16px;
  }
  .searchbox input::placeholder{color:var(--ink-faint)}
  .results{
    position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;
    z-index:30;max-height:340px;overflow-y:auto;
  }
  .results div{padding:11px 15px;display:flex;justify-content:space-between;gap:10px}
  .results div:hover,.results div.sel{background:var(--bg-2)}
  .results small{color:var(--ink-faint)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:20px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card .label{color:var(--ink-dim);font-size:13px;margin-bottom:6px}
  .card .value{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .card.hero-stat{
    background:linear-gradient(160deg,var(--amber-soft),transparent 70%);
    border-color:rgba(255,176,32,.35);
  }
  .card.hero-stat .value{color:var(--amber);font-size:44px}

  .player-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .player-head h2{margin:0;font-size:30px;letter-spacing:-.03em}
  .player-head .sub{color:var(--ink-dim)}

  .season-pills{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  .pill{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;min-width:104px;
  }
  .pill .s{color:var(--ink-faint);font-size:12px}
  .pill .v{font-weight:650;font-size:17px}
  .pill .d{font-size:12px}
  .up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--ink-faint)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:18px 0}
  .panel h3{margin:0 0 12px;font-size:16px;font-weight:650}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}
  th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--ink-dim);font-weight:600;font-size:12.5px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
  th:hover{color:var(--ink)}
  td.fpts,th.fpts{background:var(--amber-soft);color:var(--amber);font-weight:700}
  tbody tr:hover{background:var(--bg-2)}
  tr.clickable{cursor:pointer}
  td.dnp{color:var(--ink-faint);font-style:italic;text-align:left}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
  .filters label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-dim)}
  select,input[type=number]{
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
    padding:8px 10px;border-radius:9px;font-family:inherit;font-size:14px;
  }
  .btn{
    background:var(--amber);color:#17110026;color:#1a1200;border:0;border-radius:10px;
    padding:10px 14px;font-weight:650;
  }
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .footer-meta{color:var(--ink-faint);font-size:12.5px;margin-top:26px;line-height:1.7}
  .warn{color:var(--down)}
  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);padding:26px;
    color:var(--ink-dim);text-align:center;
  }
  .empty code{background:var(--bg-2);padding:2px 6px;border-radius:6px;color:var(--ink)}
  .scoring-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .scoring-grid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-dim)}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px}
  .legend i{display:inline-block;width:20px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
  @media (max-width:760px){
    header.top{
      padding:10px 12px; gap:10px;
      padding-top:calc(10px + env(safe-area-inset-top));
    }
    #navSearchWrap{order:3;flex-basis:100%;max-width:none}
    nav{margin-left:auto}
    nav button{padding:8px 10px;font-size:14px}
    main{padding:16px 12px calc(56px + env(safe-area-inset-bottom))}
    .hero{padding:30px 0 20px}
    .cards{grid-template-columns:repeat(2,1fr);gap:10px}
    .card{padding:13px}
    .card .value{font-size:24px}
    .card.hero-stat{grid-column:1 / -1}
    .card.hero-stat .value{font-size:40px}
    .pill{flex:1 1 calc(50% - 8px);min-width:0}
    .searchbox input{font-size:16px}   /* 16px stops iOS zooming on focus */
    .filters{gap:8px}
    .filters label{flex:1 1 calc(50% - 8px)}
    .filters .btn{flex:1 1 100%}
    th,td{padding:8px 9px}
    .scroll{-webkit-overflow-scrolling:touch}
    .scroll::after{content:"";display:block;height:2px}
  }
  @media (prefers-reduced-motion:no-preference){
    .card.hero-stat .value{transition:color .2s}
  }
</style>

<script>
/*
 * Offline API.
 *
 * Implements exactly the endpoints app/api.py exposes, over the dataset baked
 * into the page by tools/build_static.py. It overrides window.fetch before the
 * UI script runs, so the interface is byte-for-byte the same code online and
 * offline — there is no second frontend to keep in sync.
 *
 * The fantasy engine below is a port of app/scoring.py. tests/test_js_engine.py
 * runs both against the same real NBA rows and fails if they ever disagree.
 */
(function () {
  const D = window.__DATASET;
  if (!D) return;
  window.__OFFLINE = true;

  const STAT_KEYS = ["pts", "fg3m", "fgm", "fga", "ftm", "fta", "reb", "ast",
                     "stl", "blk", "tov"];
  const COLS = ["player_id", "season", "team", "gp", "min", "pts", "fg3m", "fgm",
                "fga", "ftm", "fta", "reb", "ast", "stl", "blk", "tov", "team_count"];

  /* ---- scoring (persisted locally so a custom barème survives a reload) ---- */
  const STORE = "nbafs.scoring";
  function getScoring() {
    const w = Object.assign({}, D.scoring);
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || "null");
      if (saved) for (const k of Object.keys(w)) if (k in saved) w[k] = Number(saved[k]);
    } catch (e) { /* private mode: fall back to the built-in barème */ }
    return w;
  }
  function setScoring(weights) {
    const w = getScoring();
    for (const k of Object.keys(w)) if (k in weights) w[k] = Number(weights[k]);
    try { localStorage.setItem(STORE, JSON.stringify(w)); } catch (e) {}
    return w;
  }

  /* ---- engine (port of app/scoring.py — no rounding anywhere) ---- */
  function fptsPerGame(row, w) {
    let total = 0;
    for (const k of STAT_KEYS) {
      const v = row[k];
      if (v === null || v === undefined) continue;
      total += v * w[k];
    }
    return total;
  }
  const simpleAverage = (vals) =>
    vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  function weightedAverage(pairs) {
    let num = 0, den = 0;
    for (const [f, gp] of pairs) { num += f * gp; den += gp; }
    return den === 0 ? null : num / den;
  }

  /* ---- dataset indexing ---- */
  const norm = (s) => (s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[-.]/g, " ").split(/\s+/).filter(Boolean).join(" ");

  const players = new Map();
  for (const [id, name, pos, team] of D.players) {
    players.set(id, { player_id: id, full_name: name, position: pos || null,
                      last_team: team || null, search_name: norm(name), seasons: new Map() });
  }
  const rows = D.rows.map((r) => {
    const row = {};
    COLS.forEach((c, i) => { row[c] = r[i]; });
    row.season = D.seasons[row.season];
    const p = players.get(row.player_id);
    if (p) { p.seasons.set(row.season, row); row.full_name = p.full_name; row.position = p.position; }
    return row;
  });

  /* ---- endpoints (mirror app/services.py) ---- */
  function seasonPayload(row, w) {
    const fpts = fptsPerGame(row, w);
    const gp = row.gp || 0;
    const out = { season: row.season, played: gp > 0, team: row.team, gp: gp,
                  min: row.min, team_count: row.team_count || 1,
                  fpts_per_game: fpts, total_fpts: fpts * gp,
                  source: D.source, fetched_at: D.generated_at };
    for (const k of STAT_KEYS) out[k] = row[k];
    out.teams = [];
    out.teams_label = out.team_count > 1
      ? `${row.team || ""} +${out.team_count - 1}` : (row.team || "");
    return out;
  }

  function playerPayload(id) {
    const p = players.get(id);
    if (!p) return null;
    const w = getScoring();
    const seasons = D.seasons.map((s) => {
      const row = p.seasons.get(s);
      return row ? seasonPayload(row, w)
                 : { season: s, played: false, note: "N/A - Did not play" };
    });
    const played = seasons.filter((s) => s.played);
    const pairs = played.map((s) => [s.fpts_per_game, s.gp]);
    return {
      player_id: p.player_id, full_name: p.full_name, position: p.position,
      last_team: p.last_team, seasons,
      summary: {
        simple_avg: simpleAverage(pairs.map((x) => x[0])),
        weighted_avg: weightedAverage(pairs),
        total_fpts: pairs.reduce((a, [f, gp]) => a + f * gp, 0),
        total_gp: pairs.reduce((a, [, gp]) => a + gp, 0),
        seasons_played: pairs.length,
        best_season: played.length
          ? played.reduce((a, b) => (b.fpts_per_game > a.fpts_per_game ? b : a)).season
          : null,
      },
      scoring: w,
    };
  }

  function search(q, limit) {
    const key = norm(q);
    if (!key) return [];
    const out = [];
    for (const p of players.values()) {
      if (p.search_name.includes(key)) {
        out.push({ player_id: p.player_id, full_name: p.full_name,
                   position: p.position, last_team: p.last_team, seasons: p.seasons.size });
      }
    }
    out.sort((a, b) => {
      const na = norm(a.full_name), nb = norm(b.full_name);
      const rank = (n) => (n.startsWith(key) ? 0 : n.split(" ").some((w) => w.startsWith(key)) ? 1 : 2);
      return rank(na) - rank(nb) || a.full_name.localeCompare(b.full_name);
    });
    return out.slice(0, limit || 12);
  }

  function leaderboard(params) {
    const w = getScoring();
    const season = params.get("season") || null;
    // `season` filters; displaySeason only fills the season column.
    const displaySeason = season || D.seasons[D.seasons.length - 1];
    const sort = params.get("sort") || "weighted_avg";
    const minGp = parseFloat(params.get("min_gp") || "0");
    const team = params.get("team") || null;
    const position = params.get("position") || null;
    const limit = parseInt(params.get("limit") || "100", 10);
    const out = [];

    for (const p of players.values()) {
      const played = [...p.seasons.values()].filter((r) => (r.gp || 0) > 0);
      if (!played.length) continue;
      const pairs = played.map((r) => [fptsPerGame(r, w), r.gp]);
      const latest = played.reduce((a, b) => (b.season > a.season ? b : a));
      const seasonRow = p.seasons.get(displaySeason);
      const seasonFpts = seasonRow && (seasonRow.gp || 0) > 0 ? fptsPerGame(seasonRow, w) : null;
      const seasonGp = seasonRow && seasonRow.gp ? seasonRow.gp : 0;

      const rec = {
        player_id: p.player_id, full_name: p.full_name, position: p.position,
        team: latest.team,
        simple_avg: simpleAverage(pairs.map((x) => x[0])),
        weighted_avg: weightedAverage(pairs),
        total_gp: pairs.reduce((a, [, gp]) => a + gp, 0),
        total_fpts: pairs.reduce((a, [f, gp]) => a + f * gp, 0),
        season: displaySeason, season_fpts: seasonFpts, season_gp: seasonGp,
      };
      if (season) {
        if (seasonFpts === null || seasonGp < minGp) continue;
        if (team && (seasonRow.team || "") !== team) continue;
      } else {
        if (rec.total_gp < minGp) continue;
        if (team && (latest.team || "") !== team) continue;
      }
      if (position && (rec.position || "") !== position) continue;
      out.push(rec);
    }

    const keys = {
      weighted_avg: (r) => r.weighted_avg || 0,
      simple_avg: (r) => r.simple_avg || 0,
      season_fpts: (r) => r.season_fpts || 0,
      gp: (r) => (season ? r.season_gp : r.total_gp),
      total_fpts: (r) => r.total_fpts || 0,
      name: (r) => r.full_name,
    };
    const key = keys[sort] || keys.weighted_avg;
    out.sort(sort === "name"
      ? (a, b) => key(a).localeCompare(key(b))
      : (a, b) => key(b) - key(a));
    const top = out.slice(0, limit);
    top.forEach((r, i) => { r.rank = i + 1; });
    return top;
  }

  function meta() {
    const perSeason = {};
    for (const r of rows) perSeason[r.season] = (perSeason[r.season] || 0) + 1;
    const teams = [...new Set(rows.map((r) => r.team).filter(Boolean))].sort();
    const positions = [...new Set([...players.values()].map((p) => p.position).filter(Boolean))].sort();
    return {
      seasons: D.seasons, stat_labels: D.stat_labels, scoring: getScoring(),
      players: players.size, rows_per_season: perSeason, teams, positions,
      last_update: D.generated_at, source: D.source, provider: D.provider,
      validation: D.validation, update_job: "idle", offline: true,
    };
  }

  /* ---- fetch shim: same routes and shapes as the FastAPI app ---- */
  const nativeFetch = window.fetch ? window.fetch.bind(window) : null;
  // A plain object rather than `new Response(...)`: fewer assumptions about the
  // runtime, so this also works in older WebViews and in a headless DOM.
  const json = (body, status) => ({
    ok: !status || status < 400,
    status: status || 200,
    json: async () => JSON.parse(JSON.stringify(body)),
    text: async () => JSON.stringify(body),
  });

  window.fetch = async function (input, init) {
    const raw = typeof input === "string" ? input : input.url;
    if (!raw || raw.indexOf("/api/") === -1) {
      return nativeFetch ? nativeFetch(input, init) : Promise.reject(new Error("offline"));
    }
    const url = new URL(raw, location.href.startsWith("file:") ? "http://local/" : location.href);
    const path = url.pathname;
    const method = ((init && init.method) || "GET").toUpperCase();

    if (path === "/api/meta") return json(meta());
    if (path === "/api/search") {
      return json({ results: search(url.searchParams.get("q") || "",
                                    parseInt(url.searchParams.get("limit") || "12", 10)) });
    }
    if (path.startsWith("/api/player/")) {
      const payload = playerPayload(parseInt(path.split("/").pop(), 10));
      return payload ? json(payload) : json({ detail: "Player not found" }, 404);
    }
    if (path === "/api/leaderboard") return json({ results: leaderboard(url.searchParams) });
    if (path === "/api/scoring") {
      if (method === "PUT") {
        const body = JSON.parse((init && init.body) || "{}");
        return json({ scoring: setScoring(body.weights || {}) });
      }
      return json({ scoring: getScoring(), labels: D.stat_labels });
    }
    if (path === "/api/update" || path === "/api/update/status") {
      return json({ status: "unavailable", log: [
        "This build has the 5 seasons embedded in the file itself.",
        "To refresh: rerun tools/fetch_from_browser.js, then tools/build_static.py.",
      ], report: null });
    }
    return json({ detail: "Not found" }, 404);
  };
})();

</script>
</head>
<body>
<header class="top">
  <div class="brand" onclick="go('home')">NBA <span>Fantasy</span> Stats</div>
  <div class="searchbox" style="flex:1;max-width:340px" id="navSearchWrap">
    <input id="navSearch" placeholder="Search NBA player…" autocomplete="off">
    <div class="results" id="navResults" hidden></div>
  </div>
  <nav>
    <button id="tab-home" onclick="go('home')">Home</button>
    <button id="tab-board" onclick="go('board')">Rankings</button>
    <button id="tab-data" onclick="go('data')">Data &amp; scoring</button>
  </nav>
</header>

<main id="view"></main>

<script>
const SEASONS = [];
let META = null, CURRENT = null, sortState = {key:"season", dir:"asc"};
const fmt = (v, d=1) => (v===null||v===undefined||Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
const el = id => document.getElementById(id);

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);
  return r.json();
}

/* ---------------- search ---------------- */
function wireSearch(input, box){
  let items = [], sel = -1, timer = null;
  const close = () => { box.hidden = true; sel = -1; };
  const render = () => {
    box.innerHTML = items.length ? "" : "<div><span>No player found</span></div>";
    items.forEach((p,i) => {
      const d = document.createElement("div");
      if(i===sel) d.className = "sel";
      d.innerHTML = `<span>${p.full_name}</span><small>${[p.position,p.last_team].filter(Boolean).join(" · ")||""}</small>`;
      d.onmousedown = e => { e.preventDefault(); close(); input.value=""; openPlayer(p.player_id); };
      box.appendChild(d);
    });
    box.hidden = false;
  };
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if(q.length < 2){ close(); return; }
    timer = setTimeout(async () => {
      try { items = (await api("/api/search?q=" + encodeURIComponent(q))).results; render(); }
      catch(e){ close(); }
    }, 120);
  });
  input.addEventListener("keydown", e => {
    if(box.hidden) return;
    if(e.key === "ArrowDown"){ sel = Math.min(sel+1, items.length-1); render(); e.preventDefault(); }
    else if(e.key === "ArrowUp"){ sel = Math.max(sel-1, 0); render(); e.preventDefault(); }
    else if(e.key === "Enter" && items[sel]){ close(); input.value=""; openPlayer(items[sel].player_id); }
    else if(e.key === "Escape"){ close(); }
  });
  input.addEventListener("blur", () => setTimeout(close, 120));
}

/* ---------------- routing ---------------- */
function go(page){
  ["home","board","data"].forEach(p => el("tab-"+p).classList.toggle("active", p===page));
  if(page==="home") renderHome();
  if(page==="board") renderBoard();
  if(page==="data") renderData();
}

/* ---------------- home ---------------- */
function renderHome(){
  const loaded = META && META.players > 0;
  el("view").innerHTML = `
    <section class="hero">
      <h1>Every NBA player, scored your way.</h1>
      <p>Five complete seasons of raw NBA stats, turned into fantasy points per game.</p>
      <div class="searchbox">
        <input id="mainSearch" placeholder="Search NBA player…" autocomplete="off">
        <div class="results" id="mainResults" hidden></div>
      </div>
      <div class="seasons-strip">${SEASONS.map(s=>`<b>${s}</b>`).join("<span>•</span>")}</div>
    </section>
    ${loaded ? "" : emptyState()}
    ${loaded ? metaFooter() : ""}`;
  const input = el("mainSearch");
  if(input){ wireSearch(input, el("mainResults")); input.focus(); }
}

function emptyState(){
  return `<div class="empty">
    <p><b>No NBA data imported yet.</b> Nothing is displayed until real stats are loaded — the app never estimates or invents numbers.</p>
    <p>Run <code>python -m app.ingest</code>, or open <b>Data &amp; scoring</b> and start an update.</p>
  </div>`;
}

function metaFooter(){
  const v = META.validation;
  const problems = v ? v.problem_count : 0;
  return `<div class="footer-meta">
    Source: ${META.source || "—"}${META.offline ? " · offline build" : ""}<br>
    Last updated: ${META.last_update ? new Date(META.last_update).toLocaleString() : "—"}<br>
    ${META.players} players · ${Object.entries(META.rows_per_season||{}).map(([s,c])=>`${s}: ${c}`).join(" · ")}<br>
    ${problems ? `<span class="warn">${problems} validation warning(s) — see Data &amp; scoring.</span>` : "Data validation passed."}
  </div>`;
}

/* ---------------- player page ---------------- */
async function openPlayer(id){
  ["home","board","data"].forEach(p => el("tab-"+p).classList.remove("active"));
  el("view").innerHTML = `<p class="dim">Loading…</p>`;
  CURRENT = await api("/api/player/" + id);
  sortState = {key:"season", dir:"asc"};
  renderPlayer();
}

function renderPlayer(){
  const p = CURRENT, s = p.summary;
  const played = p.seasons.filter(x => x.played);
  el("view").innerHTML = `
    <div class="player-head">
      <h2>${p.full_name}</h2>
      <span class="sub">${[p.position, p.last_team].filter(Boolean).join(" · ") || ""}</span>
    </div>
    <div class="cards">
      <div class="card hero-stat">
        <div class="label">5-year fantasy average</div>
        <div class="value">${fmt(s.simple_avg)}</div>
        <div class="label">FPTS/G over ${s.seasons_played} season${s.seasons_played===1?"":"s"} played</div>
      </div>
      <div class="card">
        <div class="label">Weighted 5-year FPTS/G</div>
        <div class="value">${fmt(s.weighted_avg)}</div>
        <div class="label">Σ(FPTS/G × GP) ÷ ΣGP</div>
      </div>
      <div class="card">
        <div class="label">5-year total fantasy points</div>
        <div class="value">${fmt(s.total_fpts, 0)}</div>
        <div class="label">${fmt(s.total_gp,0)} games played</div>
      </div>
      <div class="card">
        <div class="label">Best fantasy season</div>
        <div class="value">${s.best_season || "—"}</div>
        <div class="label">${played.length ? fmt(Math.max(...played.map(x=>x.fpts_per_game))) + " FPTS/G" : ""}</div>
      </div>
    </div>

    <div class="season-pills">${p.seasons.map(seasonPill).join("")}</div>

    <div class="panel">
      <h3>Fantasy points per game by season</h3>
      <div class="legend">
        <span><i style="background:var(--amber)"></i>FPTS/G</span>
        <span><i style="background:var(--cyan)"></i>PPG</span>
      </div>
      ${chart(p.seasons)}
    </div>

    <div class="panel">
      <h3>Season by season</h3>
      <div class="scroll">${playerTable(p.seasons)}</div>
    </div>
    ${metaFooter()}`;
}

function seasonPill(x){
  if(!x.played) return `<div class="pill"><div class="s">${x.season}</div><div class="v dim">N/A</div><div class="d dim">Did not play</div></div>`;
  const label = x.teams_label ? x.teams_label : (x.team || "");
  return `<div class="pill"><div class="s">${x.season}${label ? " · " + label : ""}</div>
    <div class="v">${fmt(x.fpts_per_game)}</div>
    <div class="d dim">${fmt(x.gp,0)} GP · ${fmt(x.total_fpts,0)} FP</div></div>`;
}

const COLS = [
  ["season","Season",null],["gp","GP",0],["min","MPG",1],["pts","PPG",1],["fg3m","3PM",1],
  ["fgm","FGM",1],["fga","FGA",1],["ftm","FTM",1],["fta","FTA",1],["reb","RPG",1],
  ["ast","APG",1],["stl","SPG",1],["blk","BPG",1],["tov","TO",1],
  ["fpts_per_game","FPTS/G",1],["total_fpts","Total FP",0],
];

function playerTable(seasons){
  const rows = seasons.slice();
  const {key, dir} = sortState;
  rows.sort((a,b) => {
    if(!a.played) return 1; if(!b.played) return -1;
    const va = a[key], vb = b[key];
    const c = (typeof va === "string") ? va.localeCompare(vb) : (va - vb);
    return dir === "asc" ? c : -c;
  });
  const head = COLS.map(([k,label]) =>
    `<th class="${k==='fpts_per_game'?'fpts':''}" onclick="sortBy('${k}')">${label}${sortState.key===k?(sortState.dir==="asc"?" ↑":" ↓"):""}</th>`).join("");
  const body = rows.map(x => {
    if(!x.played) return `<tr><td>${x.season}</td><td class="dnp" colspan="${COLS.length-1}">N/A — Did not play</td></tr>`;
    return "<tr>" + COLS.map(([k,,d]) => {
      if(k === "season") return `<td>${x.season}${x.teams_label ? ` <span class="dim">${x.teams_label}</span>` : ""}</td>`;
      const cls = k === "fpts_per_game" ? ' class="fpts num"' : ' class="num"';
      return `<td${cls}>${fmt(x[k], d)}</td>`;
    }).join("") + "</tr>";
  }).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function sortBy(key){
  sortState = {key, dir: sortState.key === key && sortState.dir === "desc" ? "asc" : "desc"};
  if(key === "season" && sortState.key === "season" && sortState.dir === "desc") sortState.dir = "desc";
  renderPlayer();
}

/* ---------------- chart (inline SVG) ---------------- */
function chart(seasons){
  const W = 720, H = 260, PAD_L = 44, PAD_B = 34, PAD_T = 16, PAD_R = 14;
  const pts = seasons.map(s => s.played ? {x:s.season, f:s.fpts_per_game, p:s.pts} : {x:s.season, f:null, p:null});
  const vals = pts.flatMap(d => [d.f, d.p]).filter(v => v !== null);
  if(!vals.length) return `<p class="dim">No season played in this window.</p>`;
  const max = Math.max(...vals) * 1.15, min = 0;
  const xw = (W - PAD_L - PAD_R) / Math.max(pts.length - 1, 1);
  const X = i => PAD_L + i * xw;
  const Y = v => PAD_T + (H - PAD_T - PAD_B) * (1 - (v - min) / (max - min));
  const line = (key, color) => {
    const segs = [];
    let cur = [];
    pts.forEach((d,i) => {
      if(d[key] === null){ if(cur.length) segs.push(cur); cur = []; }
      else cur.push(`${X(i)},${Y(d[key])}`);
    });
    if(cur.length) segs.push(cur);
    return segs.map(s => `<polyline fill="none" stroke="${color}" stroke-width="2.5"
       stroke-linejoin="round" points="${s.join(" ")}"/>`).join("") +
      pts.map((d,i) => d[key]===null ? "" :
        `<circle cx="${X(i)}" cy="${Y(d[key])}" r="4" fill="${color}"/>`).join("");
  };
  const grid = [0,.25,.5,.75,1].map(t => {
    const v = min + (max - min) * t;
    return `<line x1="${PAD_L}" x2="${W-PAD_R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#26314c"/>
            <text x="${PAD_L-8}" y="${Y(v)+4}" fill="#6b7690" font-size="11" text-anchor="end">${v.toFixed(0)}</text>`;
  }).join("");
  const labels = pts.map((d,i) =>
    `<text x="${X(i)}" y="${H-10}" fill="#9aa6bf" font-size="11" text-anchor="middle">${d.x}</text>`).join("");
  const values = pts.map((d,i) => d.f===null ? "" :
    `<text x="${X(i)}" y="${Y(d.f)-11}" fill="#ffb020" font-size="11.5" font-weight="600" text-anchor="middle">${d.f.toFixed(1)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Fantasy points per game by season">
    ${grid}${line("p","#54c8e8")}${line("f","#ffb020")}${values}${labels}</svg>`;
}

/* ---------------- leaderboard ---------------- */
async function renderBoard(){
  const seasonOpts = ["<option value=''>All 5 seasons</option>"]
    .concat(SEASONS.map(s => `<option>${s}</option>`)).join("");
  const teamOpts = ["<option value=''>All teams</option>"]
    .concat((META.teams||[]).map(t => `<option>${t}</option>`)).join("");
  const posOpts = ["<option value=''>All positions</option>"]
    .concat((META.positions||[]).map(t => `<option>${t}</option>`)).join("");
  el("view").innerHTML = `
    <h2 style="letter-spacing:-.03em">Fantasy rankings</h2>
    <div class="panel">
      <div class="filters">
        <label>Season<select id="fSeason">${seasonOpts}</select></label>
        <label>Sort by<select id="fSort">
          <option value="weighted_avg">Weighted 5-year FPTS/G</option>
          <option value="simple_avg">Simple 5-year FPTS/G</option>
          <option value="season_fpts">Selected season FPTS/G</option>
          <option value="total_fpts">Total fantasy points</option>
          <option value="gp">Games played</option>
          <option value="name">Player name</option>
        </select></label>
        <label>Team<select id="fTeam">${teamOpts}</select></label>
        <label>Position<select id="fPos">${posOpts}</select></label>
        <label>Min GP<input type="number" id="fGp" value="0" min="0" max="410" style="width:90px"></label>
        <button class="btn" onclick="loadBoard()">Apply filters</button>
      </div>
      <div class="scroll" id="boardTable"><p class="dim">Loading…</p></div>
    </div>`;
  ["fSeason","fSort","fTeam","fPos"].forEach(id => el(id).onchange = loadBoard);
  loadBoard();
}

async function loadBoard(){
  const q = new URLSearchParams({
    season: el("fSeason").value, sort: el("fSort").value, team: el("fTeam").value,
    position: el("fPos").value, min_gp: el("fGp").value || 0, limit: 150,
  });
  for(const [k,v] of [...q]) if(!v) q.delete(k);
  const {results} = await api("/api/leaderboard?" + q.toString());
  const season = el("fSeason").value;
  if(!results.length){ el("boardTable").innerHTML = `<p class="dim">No player matches these filters.</p>`; return; }
  el("boardTable").innerHTML = `<table>
    <thead><tr><th>#</th><th>Player</th><th>Team</th><th>Pos</th>
      <th>5Y FPTS/G</th><th class="fpts">Weighted FPTS/G</th>
      <th>${season || SEASONS[SEASONS.length-1]} FPTS/G</th><th>GP</th><th>Total FP</th></tr></thead>
    <tbody>${results.map(r => `
      <tr class="clickable" onclick="openPlayer(${r.player_id})">
        <td>${r.rank}</td><td>${r.full_name}</td><td>${r.team||"—"}</td><td>${r.position||"—"}</td>
        <td class="num">${fmt(r.simple_avg)}</td>
        <td class="fpts num">${fmt(r.weighted_avg)}</td>
        <td class="num">${r.season_fpts===null?"—":fmt(r.season_fpts)}</td>
        <td class="num">${fmt(season ? r.season_gp : r.total_gp, 0)}</td>
        <td class="num">${fmt(r.total_fpts,0)}</td>
      </tr>`).join("")}</tbody></table>`;
}

/* ---------------- data & scoring ---------------- */
function renderData(){
  const v = META.validation;
  el("view").innerHTML = `
    <h2 style="letter-spacing:-.03em">Data &amp; scoring</h2>
    <div class="panel">
      <h3>Scoring settings</h3>
      <p class="dim" style="margin-top:0;font-size:13.5px">Values apply to per-game averages. Changing them recalculates every FPTS instantly — NBA data is never re-imported.</p>
      <div class="scoring-grid">${Object.entries(META.stat_labels).map(([k,label]) =>
        `<label>${label}<input type="number" step="0.5" id="w-${k}" value="${META.scoring[k]}"></label>`).join("")}</div>
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="btn" onclick="saveScoring()">Save scoring</button>
        <button class="btn ghost" onclick="resetScoring()">Restore defaults</button>
      </div>
    </div>
    <div class="panel">
      <h3>NBA data</h3>
      <p class="dim" style="font-size:13.5px;margin-top:0">
        Provider: ${META.provider} · Source: ${META.source || "—"}<br>
        Last updated: ${META.last_update ? new Date(META.last_update).toLocaleString() : "never"}<br>
        ${META.players} players · ${Object.entries(META.rows_per_season||{}).map(([s,c])=>`${s}: ${c}`).join(" · ") || "no season loaded"}
      </p>
      ${window.__OFFLINE
        ? `<p class="dim" style="font-size:13.5px">The 5 seasons are embedded in this file, so it works with no connection. To refresh them: rerun <code>tools/fetch_from_browser.js</code> in a browser, then <code>tools/build_static.py</code>.</p>`
        : `<button class="btn" onclick="startUpdate()">Update NBA data</button>`}
      <pre id="jobLog" style="white-space:pre-wrap;color:var(--ink-dim);font-size:12.5px"></pre>
    </div>
    <div class="panel">
      <h3>Validation report</h3>
      ${v ? `<p class="dim" style="font-size:13.5px">${v.rows} rows checked · ${v.problem_count} problem(s)</p>
        <ul class="dim" style="font-size:13px">${(v.problems||[]).slice(0,25).map(p=>`<li>${p}</li>`).join("") || "<li>No inconsistency detected.</li>"}</ul>`
        : `<p class="dim">No import has run yet.</p>`}
    </div>`;
}

async function saveScoring(){
  const weights = {};
  Object.keys(META.stat_labels).forEach(k => weights[k] = parseFloat(el("w-"+k).value));
  await api("/api/scoring", {method:"PUT", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({weights})});
  await loadMeta(); renderData();
}
async function resetScoring(){
  const d = {pts:1,fg3m:1,fgm:2,fga:-1,ftm:1,fta:-1,reb:1,ast:2,stl:4,blk:4,tov:-2};
  await api("/api/scoring", {method:"PUT", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({weights:d})});
  await loadMeta(); renderData();
}
async function startUpdate(){
  el("jobLog").textContent = "Starting…";
  await api("/api/update", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({provider: META.provider})});
  const poll = setInterval(async () => {
    const s = await api("/api/update/status");
    el("jobLog").textContent = s.log.join("\n");
    if(s.status !== "running"){
      clearInterval(poll);
      el("jobLog").textContent += `\nUpdate ${s.status}.`;
      await loadMeta();
    }
  }, 1500);
}

/* ---------------- boot ---------------- */
async function loadMeta(){
  META = await api("/api/meta");
  SEASONS.length = 0; SEASONS.push(...META.seasons);
}
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  const swUrl = new URL("sw.js", document.baseURI).href;
  window.addEventListener("load", () => navigator.serviceWorker.register(swUrl).catch(()=>{}));
}
(async () => {
  await loadMeta();
  wireSearch(el("navSearch"), el("navResults"));
  go("home");
})();
</script>
