<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA Fantasy Stats</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1f4294">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy Stats">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./assets/style.css">
<link rel="stylesheet" href="./assets/companion.css">
<link rel="stylesheet" href="./assets/dashboard.css">


</head>
<body>
<header class="top">
  <button type="button" class="brand" onclick="go('home')" aria-label="NBA Fantasy Stats, accueil"><img class="brand-logo" src="./assets/brand/lebron-nba-original.webp" alt="" width="54" height="68"><span class="brand-text">NBA <span>Fantasy</span> Stats</span></button>
  <div class="searchbox" id="navSearchWrap">
    <input aria-label="Rechercher des joueurs NBA" id="navSearch" placeholder="Rechercher un joueur NBA…" autocomplete="off">
    <div class="results" id="navResults" hidden></div>
  </div>
  <nav>
    <button id="tab-home" onclick="go('home')">Accueil</button>
    <button id="tab-board" onclick="go('board')">Classements</button>
    <button id="tab-trades" onclick="go('trades')">Trades</button>
    <button id="tab-compare" onclick="go('compare')">Comparer</button>
    <button id="tab-data" onclick="go('data')">Données et barème</button>
  </nav>
</header>

<main id="view"><p role="status">Chargement des données vérifiées…</p></main>


<script type="module" src="./assets/boot.mjs"></script>
</body>
</html>
